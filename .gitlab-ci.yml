image: node:20-alpine

# Define stages
stages:
  - test
  - deploy

# This folder is cached between builds
# http://docs.gitlab.com/ce/ci/yaml/README.html#cache
cache:
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - node_modules/
    - .pnpm-store/

variables:
  PNPM_HOME: .pnpm-store
  DEPENDABOT_IMAGE: docker.io/andrcuns/dependabot-gitlab:latest

test_async:
  stage: test
  script:
    - corepack enable
    - pnpm install
    - pnpm test
    - pnpm lint

# Upload translations to Lokalise when PR is merged to main
upload_translations:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
      when: on_success
    - when: never
  before_script:
    - yarn install --frozen-lockfile
  script:
    - echo "📤 Uploading translations to Lokalise..."
    - echo "🔍 Checking environment variables..."
    - |
      if [ -z "$LOKALISE_PROJECT_ID" ]; then
        echo "❌ LOKALISE_PROJECT_ID is not set"
        exit 1
      fi
    - |
      if [ -z "$LOKALISE_API_TOKEN" ]; then
        echo "❌ LOKALISE_API_TOKEN is not set"
        exit 1
      fi
    - echo "✅ Environment variables are set"
    - yarn translations:upload

  variables:
    LOKALISE_PROJECT_ID: $LOKALISE_PROJECT_ID
    LOKALISE_API_TOKEN: $LOKALISE_API_TOKEN
.dependabot-gitlab:
  image:
    name: $DEPENDABOT_IMAGE
    entrypoint: ['']
  variables:
    GIT_STRATEGY: none
    PACKAGE_MANAGER: $CI_JOB_NAME
    SETTINGS__GITLAB_URL: $CI_SERVER_URL
    SETTINGS__GITLAB_ACCESS_TOKEN: $GITLAB_ACCESS_TOKEN
    SETTINGS__GITHUB_ACCESS_TOKEN: $GITHUB_ACCESS_TOKEN
    SETTINGS__STANDALONE_CACHE_PATH: $CI_PROJECT_DIR/.dependabot/cache
  script:
    - cd /home/dependabot/app
    - ./scripts/run.sh --project-name "$CI_PROJECT_PATH" --package-ecosystem "$PACKAGE_MANAGER" --directory "${DIRECTORY:-/}"
  cache:
    - key: dependabot
      policy: pull-push
      paths:
        - $CI_PROJECT_DIR/.dependabot/cache

npm:
  extends: .dependabot-gitlab
  rules:
    - if: $DEPENDENCY_UPDATES_DISABLED
      when: never
    - if: '$CI_PIPELINE_SOURCE =~ /schedule|api|web/ && $PACKAGE_MANAGER_SET =~ /(\bnpm|pnpm\b)/'
